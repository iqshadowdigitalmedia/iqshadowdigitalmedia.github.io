backend:
  name: github
    repo: iqshadowdigitalmedia/iqshadowdigitalmedia.github.io
      branch: main

      media_folder: "images"
      public_folder: "/images"

      collections:
        - name: "posts"
            label: "Posts"
                folder: "posts"
                    create: true
                        fields:
                              - {label: "Title", name: "title", widget: "string"}
                                    - {label: "Date", name: "date", widget: "datetime"}
                                          - {label: "Body", name: "body", widget: "markdown"}